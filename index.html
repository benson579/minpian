<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benson 數位名片傳送助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #111827; }
        .gold-bg { background: linear-gradient(135deg, #C0A062 0%, #a68a52 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center text-white">

    <div class="max-w-xs w-full">
        <!-- 狀態顯示區 -->
        <div id="loadingUI">
            <div class="w-12 h-12 border-4 border-[#C0A062] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h1 class="text-lg font-bold">正在連線 LINE 傳送引擎</h1>
            <p id="statusDesc" class="text-gray-400 text-xs mt-2 text-balance">啟動中，請稍候...</p>
        </div>

        <!-- 手動按鈕區 -->
        <div id="manualUI" class="hidden">
            <div class="w-16 h-16 gold-bg rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-2xl">
                <i class="fas fa-share-nodes text-white text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold">分享名片給好友</h1>
            <button onclick="sendBensonCard()" class="mt-8 w-full py-4 gold-bg text-white rounded-2xl font-black text-lg active:scale-95 transition-all shadow-lg">
                選取好友並發送
            </button>
        </div>

        <!-- 錯誤提示區 -->
        <div id="errorUI" class="hidden bg-red-500/10 border border-red-500/50 p-6 rounded-[2rem]">
            <h1 class="text-red-400 font-bold mb-2 text-lg">初始化失敗</h1>
            <p id="errorDetail" class="text-gray-300 text-xs leading-relaxed"></p>
            <button onclick="window.location.reload()" class="mt-4 text-[10px] text-white/50 underline uppercase tracking-widest">重新整理</button>
        </div>
    </div>

    <script>
        const MY_LIFF_ID = "2008738532-iGK7DgOR"; 

        // 輔助函式：產生帶有金色星星的內容行

            "contents": [
                { "type": "span", "text": "★ ", "color": "#C0A062" },
                { "type": "span", "text": text }
            ],
            "size": "sm",
            "color": "#6b7280",
            "wrap": true
        });

        const bensonJson = {
          "type": "carousel",
          "contents": [
            {
              "type": "bubble",
              "size": "mega",
              "header": {
                "type": "box", "layout": "vertical", "backgroundColor": "#111111", "paddingAll": "16px",
                "contents": [
                  { "type": "text", "text": "PROFESSIONAL PROFILE", "color": "#C0A062", "size": "xxs", "weight": "bold" },
                  { "type": "text", "text": "01", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "position": "absolute", "offsetTop": "5px", "offsetEnd": "15px" }
                ]
              },
              "hero": {
                "type": "image",
                "url": "https://i.postimg.cc/mZJRPh35/8E00EF55-E081-43BC-82C2-B50578FA27B6.jpg",
                "size": "full", "aspectRatio": "4:5", "aspectMode": "cover", "backgroundColor": "#F3F4F6"
              },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "謝兆鎔 Benson", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "御謙VIP菁英會 業務經理", "size": "xs", "color": "#C0A062", "margin": "xs", "weight": "bold" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("CIA500 強團隊核心成員"),
                      starLine("團隊累積管理客戶資金高達 20 億"),
                      starLine("全台 RFP 財務策劃師最高濃度團隊")
                    ]
                  },
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "✨ 加 LINE 好友", "uri": "https://line.me/ti/p/UYh9gcYETH" }, "color": "#C0A062" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📝 諮詢表單連結", "uri": "https://financesheet-1.vercel.app/" }, "color": "#404040" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "➤ 分享給好友", "uri": "https://liff.line.me/" + MY_LIFF_ID }, "color": "#404040" }
                ]
              }
            },
            {
              "type": "bubble",
              "size": "mega",
              "header": {
                "type": "box", "layout": "vertical", "backgroundColor": "#111111", "paddingAll": "16px",
                "contents": [
                  { "type": "text", "text": "SERVICES & SOLUTIONS", "color": "#C0A062", "size": "xxs", "weight": "bold" },
                  { "type": "text", "text": "02", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "position": "absolute", "offsetTop": "5px", "offsetEnd": "15px" }
                ]
              },
              "hero": {
                "type": "image",
                "url": "https://i.postimg.cc/PJJfxyfP/VIP_財務策劃書_16比9.png",
                "size": "full", "aspectRatio": "1.5:1", "aspectMode": "cover"
              },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "客製化財務策劃書", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "WEALTH MANAGEMENT", "size": "xs", "color": "#9ca3af", "margin": "xs" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("金流規劃 - 房貸減免 | 退休規劃"),
                      starLine("風險規劃 - 減少保費 | 提高保障"),
                      starLine("財務規劃 - 資產配置 | 信貸整合"),
                      starLine("教育旅遊 - 子女教育 | 免費出國"),

                ]

              "footer": {

                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📜 什麼是 RFP?", "uri": "https://www.rfpi.com.tw/portal_a1.php?owner_num=a1_205771&button_num=a1" }, "color": "#C0A062" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📷 INSTAGRAM", "uri": "https://www.instagram.com/benson__special?igsh=aTI4c2RqcnV6aW1h&utm_source=qr" }, "color": "#404040" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📘 FACEBOOK", "uri": "https://www.facebook.com/share/16v1wrqK9c/?mibextid=wwXIfr" }, "color": "#404040" }
                ]
              }
            },
            {
              "type": "bubble",
              "size": "mega",
              "header": {
                "type": "box", "layout": "vertical", "backgroundColor": "#111111", "paddingAll": "16px",
                "contents": [
                  { "type": "text", "text": "COMPANY OVERVIEW", "color": "#C0A062", "size": "xxs", "weight": "bold" },
                  { "type": "text", "text": "03", "color": "#222222", "align": "end", "size": "3xl", "weight": "bold", "position": "absolute", "offsetTop": "5px", "offsetEnd": "15px" }
                ]
              },
              "hero": {
                "type": "image",
                "url": "https://i.postimg.cc/3NNrR1rY/圖片1.jpg",
                "size": "full", "aspectRatio": "1.5:1", "aspectMode": "cover"
              },
              "body": {
                "type": "box", "layout": "vertical", "contents": [
                  { "type": "text", "text": "御謙VIP菁英會", "weight": "bold", "size": "xl", "color": "#111827" },
                  { "type": "text", "text": "GROUP PROFILE", "size": "xs", "color": "#9ca3af", "margin": "xs" },
                  { "type": "separator", "margin": "md", "color": "#f3f4f6" },
                  { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm",
                    "contents": [
                      starLine("世界 CIA500 強團隊"),
                      starLine("[專屬財務規劃] 客製化財務方案"),
                      starLine("[人才培訓規劃] 百萬年薪規劃師"),
                      starLine("[資源整合服務] 專業會計師/貸款合作"),
                      starLine("[財經教育講座] 稅務、投資、理財講座")
                    ]
                  },
                ]
              },
              "footer": {
                "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📷 官方 Instagram", "uri": "https://www.instagram.com/youtrend_vip?igsh=ZmxwOWUzNTY3Z2Jw" }, "color": "#404040" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📘 官方 Facebook", "uri": "https://www.facebook.com/share/1CsML2XrDx/?mibextid=wwXIfr" }, "color": "#404040" },
                  { "type": "button", "style": "primary", "height": "sm", "action": { "type": "uri", "label": "📍 公司地址", "uri": "https://maps.app.goo.gl/81JB2KBH2fMA87Dz7?g_st=ipc" }, "color": "#404040" }
                ]
              }
            }
          ]
        };

        function showError(err, title = "分享失敗") {
            document.getElementById('loadingUI').classList.add('hidden');
            document.getElementById('manualUI').classList.add('hidden');
            document.getElementById('errorUI').classList.remove('hidden');

            const code = err && err.code ? `\n錯誤代碼：${err.code}` : "";
            const message = err && err.message ? err.message : String(err || "未知錯誤");
            const inClient = typeof liff !== "undefined" && typeof liff.isInClient === "function"
                ? liff.isInClient()
                : false;
            const apiAvailable = typeof liff !== "undefined" && typeof liff.isApiAvailable === "function"
                ? liff.isApiAvailable("shareTargetPicker")
                : false;

            document.querySelector("#errorUI h1").innerText = title;
            document.getElementById('errorDetail').innerText =
                `${message}${code}\n\nLIFF 環境：${inClient ? "LINE LIFF Browser" : "外部瀏覽器"}\nShare Target Picker：${apiAvailable ? "可用" : "不可用"}`;
        }

        async function sendBensonCard() {
            try {
                if (!liff.isApiAvailable('shareTargetPicker')) {
                    throw new Error("目前開啟這個 LIFF 的環境無法使用「分享給好友」。請從 LINE App 內開啟 LIFF 連結。");
                }

                const res = await liff.shareTargetPicker([
                    {
                        "type": "flex",
                        "altText": "Benson 謝兆鎔與您分享數位名片",
                        "contents": bensonJson
                    }
                ]);

                if (res) {
                    liff.closeWindow();
                }
            } catch (err) {
                showError(err, "分享失敗");
            }
        }

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });

                // LIFF Browser 在 liff.init() 時已完成登入；
                // 只有外部瀏覽器才需要另外執行 liff.login()。
                if (!liff.isInClient() && !liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                await sendBensonCard();
            } catch (err) {
                showError(err, "LIFF 初始化失敗");
            }
        }

        window.onload = main;
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
